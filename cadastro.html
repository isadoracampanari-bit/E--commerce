<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sephora Collection | Finalizar Compra</title>
    <!-- Link para FontAwesome para os ícones de pagamento (Pix, Visa, Mastercard, Boleto) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --sephora-black: #000000;
            --sephora-gray-dark: #1c1c1c;
            --sephora-gray-light: #f6f6f6;
            --sephora-border: #cccccc;
            --success-color: #008a5b; /* Verde Sephora para validação positiva */
            --error-color: #d90429;    /* Vermelho vibrante para erros */
            --text-color: #000000;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .checkout-container {
            width: 100%;
            max-width: 750px;
            background: #ffffff;
            padding: 0;
        }

        h1 {
            text-align: center;
            font-size: 1.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            color: var(--sephora-black);
            border-bottom: 2px solid var(--sephora-black);
            padding-bottom: 15px;
        }

        fieldset {
            border: 1px solid var(--sephora-border);
            border-radius: 0; /* Design Sephora usa bordas retas */
            padding: 30px;
            margin-bottom: 35px;
            background-color: #ffffff;
        }

        legend {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 0 15px;
            color: var(--sephora-black);
            font-size: 0.95rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        label {
            margin-bottom: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Estilização Base dos Inputs no Padrão Sephora */
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"],
        input[type="date"],
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--sephora-border);
            border-radius: 0; /* Bordas retas */
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background-color: #ffffff;
            color: var(--text-color);
        }

        /* Requisito 3: Pseudo-classes de Estilização Avançada e Validação */
        input:focus, select:focus {
            border-color: var(--sephora-black);
            box-shadow: 0 0 0 1px var(--sephora-black);
        }

        input:focus:valid, select:focus:valid {
            border-color: var(--success-color);
            box-shadow: 0 0 0 1px var(--success-color);
        }

        input:focus:invalid, select:focus:invalid {
            border-color: var(--error-color);
            box-shadow: 0 0 0 1px var(--error-color);
        }

        input[type="file"] {
            padding: 8px 0;
            font-size: 0.85rem;
        }

        /* Estilização Exclusiva do Bloco de Pagamento (Visual Clean) */
        .payment-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .payment-item {
            position: relative;
        }

        .payment-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border: 1px solid var(--sephora-border);
            border-radius: 0;
            cursor: pointer;
            background: #ffffff;
            transition: all 0.2s ease;
        }

        .payment-label:hover {
            background-color: var(--sephora-gray-light);
        }

        .payment-info {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .payment-icons i {
            font-size: 1.8rem;
            color: var(--sephora-gray-dark);
            margin-left: 8px;
            vertical-align: middle;
        }

        /* Marcador ativo customizado quando selecionado */
        input[type="radio"]:checked + .payment-label {
            border: 2px solid var(--sephora-black);
            background-color: var(--sephora-gray-light);
        }

        .payment-item input[type="radio"]:focus-visible + .payment-label {
            outline: 2px solid var(--sephora-black);
            outline-offset: 2px;
        }

        /* Esconde estruturalmente o input mantendo acessível à W3C */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Termos de uso e Botão Principal Sacola/Checkout */
        .terms-container {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-top: 10px;
            margin-bottom: 35px;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .terms-container input {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            cursor: pointer;
            border-radius: 0;
            accent-color: var(--sephora-black);
        }

        .terms-container a {
            color: var(--sephora-black);
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 20px;
            background-color: var(--sephora-black);
            color: #ffffff;
            border: none;
            border-radius: 0;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #333333;
        }

        .btn-submit:focus-visible {
            outline: 2px solid var(--sephora-black);
            outline-offset: 3px;
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <h1>Finalizar Compra</h1>

        <form action="#" method="POST" enctype="multipart/form-data">

            <!-- BLOCO 1: DADOS PESSOAIS -->
            <fieldset>
                <legend>Dados Pessoais</legend>

                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required placeholder="seu-email@dominio.com">
                    </div>
                    <div class="form-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" required
                               pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}"
                               placeholder="000.000.000-00"
                               inputmode="numeric"
                               title="Digite o CPF no formato 000.000.000-00">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="telefone">Telefone / WhatsApp</label>
                        <input type="tel" id="telefone" name="telefone" required
                               pattern="\(?\d{2}\)?\s?\d{4,5}-?\d{4}"
                               placeholder="(11) 99999-9999">
                    </div>
                    <div class="form-group">
                        <label for="nascimento">Data de Nascimento</label>
                        <input type="date" id="nascimento" name="nascimento" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="senha">Criar Senha de Acesso</label>
                    <input type="password" id="senha" name="senha" required minlength="6" placeholder="Mínimo de 6 caracteres">
                </div>

                <div class="form-group">
                    <label for="avatar">Foto de Perfil / Avatar (Opcional)</label>
                    <input type="file" id="avatar" name="avatar" accept="image/*">
                </div>
            </fieldset>

            <!-- BLOCO 2: ENDEREÇO DE ENTREGA -->
            <fieldset>
                <legend>Endereço de Entrega</legend>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" name="cep" required pattern="\d{5}-?\d{3}" inputmode="numeric" placeholder="00000-000">
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label for="rua">Rua / Logradouro</label>
                        <input type="text" id="rua" name="rua" required placeholder="Ex: Av. Paulista">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" name="numero" required placeholder="123">
                    </div>
                    <div class="form-group">
                        <label for="complemento">Complemento</label>
                        <input type="text" id="complemento" name="complemento" placeholder="Apto, bloco, referência (opcional)">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" required placeholder="Digite seu bairro">
                    </div>
                    <div class="form-group">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" required placeholder="Digite sua cidade">
                    </div>
                    <div class="form-group">
                        <label for="estado">Estado</label>
                        <select id="estado" name="estado" required>
                            <option value="" selected disabled>Selecione</option>
                            <option value="AC">AC</option>
                            <option value="AL">AL</option>
                            <option value="AM">AM</option>
                            <option value="AP">AP</option>
                            <option value="BA">BA</option>
                            <option value="CE">CE</option>
                            <option value="DF">DF</option>
                            <option value="ES">ES</option>
                            <option value="GO">GO</option>
                            <option value="MA">MA</option>
                            <option value="MG">MG</option>
                            <option value="MS">MS</option>
                            <option value="MT">MT</option>
                            <option value="PA">PA</option>
                            <option value="PB">PB</option>
                            <option value="PE">PE</option>
                            <option value="PI">PI</option>
                            <option value="PR">PR</option>
                            <option value="RJ">RJ</option>
                            <option value="RN">RN</option>
                            <option value="RO">RO</option>
                            <option value="RR">RR</option>
                            <option value="RS">RS</option>
                            <option value="SC">SC</option>
                            <option value="SE">SE</option>
                            <option value="SP">SP</option>
                            <option value="TO">TO</option>
                        </select>
                    </div>
                </div>
            </fieldset>

            <!-- BLOCO 3: FORMA DE PAGAMENTO -->
            <fieldset>
                <legend>Forma de Pagamento</legend>

                <div class="payment-options">
                    <div class="payment-item">
                        <input type="radio" id="pagamento-pix" name="pagamento" value="pix" class="sr-only" required checked>
                        <label for="pagamento-pix" class="payment-label">
                            <span class="payment-info">Pix · 5% de desconto</span>
                            <span class="payment-icons"><i class="fa-brands fa-pix" aria-hidden="true"></i></span>
                        </label>
                    </div>

                    <div class="payment-item">
                        <input type="radio" id="pagamento-cartao" name="pagamento" value="cartao" class="sr-only">
                        <label for="pagamento-cartao" class="payment-label">
                            <span class="payment-info">Cartão de Crédito · até 6x sem juros</span>
                            <span class="payment-icons">
                                <i class="fa-brands fa-cc-visa" aria-hidden="true"></i>
                                <i class="fa-brands fa-cc-mastercard" aria-hidden="true"></i>
                            </span>
                        </label>
                    </div>

                    <div class="payment-item">
                        <input type="radio" id="pagamento-boleto" name="pagamento" value="boleto" class="sr-only">
                        <label for="pagamento-boleto" class="payment-label">
                            <span class="payment-info">Boleto Bancário</span>
                            <span class="payment-icons"><i class="fa-solid fa-barcode" aria-hidden="true"></i></span>
                        </label>
                    </div>
                </div>
            </fieldset>

            <div class="terms-container">
                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos" style="margin-bottom:0; text-transform:none; font-weight:400; letter-spacing:normal;">
                    Li e aceito os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a> da Sephora Collection.
                </label>
            </div>

            <button type="submit" class="btn-submit">Concluir Cadastro e Pagar</button>

        </form>
    </div>

</body>
</html>
